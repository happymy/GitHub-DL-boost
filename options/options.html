<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub-DL-boost 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; color: #24292f; background: #f6f8fa; padding: 24px;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 20px; }
    h2 { font-size: 16px; margin-bottom: 10px; }

    .card {
      background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
      padding: 16px; margin-bottom: 16px;
    }

    .proxy-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #eee;
    }
    .proxy-item:last-child { border-bottom: none; }
    .proxy-item .name { font-weight: 500; }
    .proxy-item .active-badge {
      background: #2da44e; color: #fff; font-size: 11px;
      padding: 2px 8px; border-radius: 10px;
    }
    .proxy-item .actions button {
      background: none; border: none; cursor: pointer; font-size: 13px;
      padding: 4px 8px; border-radius: 4px; margin-left: 4px;
    }
    .proxy-item .actions .use-btn { color: #0969da; }
    .proxy-item .actions .use-btn:hover { background: #ddf4ff; }
    .proxy-item .actions .del-btn { color: #cf222e; }
    .proxy-item .actions .del-btn:hover { background: #ffebe9; }

    .add-row {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .add-row input {
      flex: 1; padding: 8px 12px; border: 1px solid #d0d7de;
      border-radius: 6px; font-size: 14px;
    }
    .add-row input:focus { outline: none; border-color: #0969da; box-shadow: 0 0 0 3px #0969da33; }

    .btn {
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
      border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f; white-space: nowrap;
    }
    .btn-primary { background: #2da44e; color: #fff; border-color: #2da44e; }
    .btn-primary:hover { background: #218838; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #24292f; color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; opacity: 0; transition: opacity .3s;
    }
    .toast.show { opacity: 1; }

    .empty { color: #656d76; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GitHub-DL-boost 设置</h1>

    <div class="card">
      <h2>代理源列表</h2>
      <p style="color:#656d76;margin-bottom:12px;font-size:13px;">
        选择当前使用的加速站，或添加自定义加速站域名。
      </p>
      <div id="proxyList"></div>

      <div class="add-row">
        <input type="text" id="newProxy" placeholder="输入加速站域名，如 gh-proxy.com" />
        <button class="btn btn-primary" id="addBtn">添加</button>
      </div>
    </div>

    <div class="card">
      <h2>关于</h2>
      <p style="color:#656d76;font-size:13px;">
        GitHub-DL-boost 使用 declarativeNetRequest 动态重写 URL，
        所有处理在浏览器本地完成，不收集任何数据。
        <br><br>
        <a href="#" id="resetLink" style="color:#cf222e;">恢复默认设置</a>
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="options.js"></script>
</body>
</html>
